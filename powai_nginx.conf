# Nginx configuration pour powai.ca (Serveur Debian 10.0.0.214)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name powai.ca www.powai.ca _;

    root /var/www/html;
    index index.html index.htm;
    client_max_body_size 50M;

    # 1. BORNE QUÉBEC (/borne/)
    location /borne/assets/ {
        alias /var/www/html/borne/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /borne/ {
        alias /var/www/html/borne/;
        index index.html;
        try_files $uri $uri/ /borne/index.html;
    }

    location = /borne {
        return 301 /borne/;
    }

    # 2. PowAI TEL — VOIP ANDROID (/tel/ & /voip/)
    location /tel/assets/ {
        alias /var/www/html/tel/assets/;
        expires 30d;
    }

    location /tel/ {
        alias /var/www/html/tel/;
        index index.html;
        try_files $uri $uri/ /tel/index.html;
    }

    location = /tel {
        return 301 /tel/;
    }

    location /voip/assets/ {
        alias /var/www/html/tel/assets/;
    }

    location /voip/ {
        alias /var/www/html/tel/;
        index index.html;
        try_files $uri $uri/ /tel/index.html;
    }

    location = /voip {
        return 301 /tel/;
    }

    # 3. SURSITRACK & HORIZON (/sursitrack/ & /horizon/)
    location /sursitrack/assets/ {
        alias /var/www/html/sursitrack/assets/;
        expires 30d;
    }

    location /sursitrack/ {
        alias /var/www/html/sursitrack/;
        index index.html;
        try_files $uri $uri/ /sursitrack/index.html;
    }

    location = /sursitrack {
        return 301 /sursitrack/;
    }

    location /horizon/assets/ {
        alias /var/www/html/sursitrack/assets/;
    }

    location /horizon/ {
        alias /var/www/html/sursitrack/;
        index index.html;
        try_files $uri $uri/ /sursitrack/index.html;
    }

    location = /horizon {
        return 301 /horizon/;
    }

    # 4. AUDITREQ (/auditreq/ & /auditraq/)
    location /auditreq/assets/ {
        alias /var/www/html/auditreq/assets/;
        expires 30d;
    }

    location /auditreq/ {
        alias /var/www/html/auditreq/;
        index index.html;
        try_files $uri $uri/ /auditreq/index.html;
    }

    location = /auditreq {
        return 301 /auditreq/;
    }

    location = /auditraq {
        return 301 /auditreq/;
    }

    location = /auditraq/ {
        return 301 /auditreq/;
    }

    # 5. SPEED SLOTS (/speed/)
    location /speed/assets/ {
        alias /var/www/html/speed/assets/;
    }

    location /speed/ {
        alias /var/www/html/speed/;
        index index.html;
        try_files $uri $uri/ /speed/index.html;
    }

    location = /speed {
        return 301 /speed/;
    }

    # 6. CHRONO SLOTS (/slot/)
    location /slot/assets/ {
        alias /var/www/html/slot/assets/;
    }

    location /slot/ {
        alias /var/www/html/slot/;
        index index.html;
        try_files $uri $uri/ /slot/index.html;
    }

    location = /slot {
        return 301 /slot/;
    }

    # 7. WONDERLAND ALICE (/alice/)
    location /alice/assets/ {
        alias /var/www/html/alice/assets/;
    }

    location /alice/ {
        alias /var/www/html/alice/;
        index index.html;
        try_files $uri $uri/ /alice/index.html;
    }

    location = /alice {
        return 301 /alice/;
    }

    # 8. SAAQ$$$clic (Anti-modèle satirique)
    location /saadeklic/ {
        alias /var/www/html/saadeklic/;
        index index.html;
        try_files $uri $uri/ /saadeklic/index.html;
    }

    location = /saadeklic {
        return 301 /saadeklic/;
    }

    # 9. SursiTrack Backend API (Port 3002)
    location /api/sursitrack {
        proxy_pass http://127.0.0.1:3002/api/sursitrack;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 10. AudiTREQ API (Port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 11. Nextcloud Docker Proxy (/nextcloud/ - Port 8080)
    location /nextcloud/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 12. Racine PowAI.ca
    location / {
        try_files $uri $uri/ /index.html;
    }
}